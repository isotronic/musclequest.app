<!doctype html>
<html><head><meta charset="utf-8" />
<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@500;800&display=swap");
  body { margin: 0; width: 1200px; height: 630px; background: #22222d; color: #ecedee; font-family: Inter, sans-serif; display: grid; grid-template-columns: 1fr 380px; overflow: hidden; }
  .copy { padding: 80px 0 0 80px; }
  .brand { display: flex; align-items: center; gap: 14px; color: #ebaa39; font-weight: 800; font-size: 34px; }
  .brand img { width: 60px; }
  h1 { font-size: 72px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; margin: 56px 0 24px; }
  h1 span { color: #ebaa39; }
  p { font-size: 24px; color: #9ba1a6; margin: 0; }
  .phone { align-self: end; margin-top: 70px; width: 320px; border: 8px solid #000; border-bottom: 0; border-radius: 40px 40px 0 0; overflow: hidden; box-shadow: 0 0 120px rgba(235,170,57,.25); }
  .phone img { width: 100%; display: block; }
</style></head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../src/assets/logo.png" alt="" />MuscleQuest</div>
    <h1>Plan it. Lift it.<br /><span>Watch it add up.</span></h1>
    <p>Free workout tracker for Android · No ads · Works offline</p>
  </div>
  <div class="phone"><img src="../../src/assets/screenshots/home.png" alt="" /></div>
</body></html>
