<!doctype html>
<html><head><meta charset="utf-8" />
<!-- Social preview for /coach/ (public/og-coach.png): S1 on the dark background with the headline. See the README. -->
<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@500;800&display=swap");
  body { margin: 0; width: 1200px; height: 630px; background: #22222d; color: #ecedee; font-family: Inter, sans-serif; position: relative; overflow: hidden; }
  .copy { position: relative; z-index: 1; padding: 130px 0 0 80px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 14px; color: #ebaa39; font-weight: 800; font-size: 34px; }
  .brand img { width: 60px; }
  .brand span { color: #ecedee; font-weight: 500; }
  h1 { font-size: 50px; line-height: 1.06; font-weight: 800; letter-spacing: -0.02em; margin: 52px 0 24px; }
  h1 span { color: #ebaa39; }
  p { font-size: 24px; color: #9ba1a6; margin: 0; }
  .shot { position: absolute; left: 700px; top: 110px; width: 860px; border: 1px solid #3a3a4a; border-radius: 16px; overflow: hidden; background: #2a2a36; box-shadow: 0 0 120px rgba(235,170,57,.25); }
  .bar { display: flex; gap: 8px; align-items: center; height: 28px; padding: 0 14px; background: #2a2a36; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #3a3a4a; }
  .shot img { width: 100%; display: block; }
</style></head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../src/assets/logo.png" alt="" />MuscleQuest <span>Coach</span></div>
    <h1>Build the plan once.<br /><span>See every set they log.</span></h1>
    <p>For personal trainers and online coaches</p>
  </div>
  <div class="shot"><div class="bar"><i></i><i></i><i></i></div><img src="../../src/assets/screenshots/coach-builder.png" alt="" /></div>
</body></html>
